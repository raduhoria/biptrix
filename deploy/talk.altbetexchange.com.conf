# /etc/nginx/sites-available/talk.altbetexchange.com.conf on ai-wizz.
# Public path: Cloudflare -> lb1/lb2 (TLS, be_biptrix) -> here -> 127.0.0.1:3400.
# Only the load balancers may connect; anything else gets 403.
# The certificate here only protects the internal hop (HAProxy does not verify
# it); the public certificate is served by Cloudflare and HAProxy.

upstream biptrix {
  server 127.0.0.1:3400;
  keepalive 16;
}

# WebSocket upgrade for /ws and /ws/meeting; plain keep-alive otherwise.
map $http_upgrade $biptrix_connection {
  default upgrade;
  ''      '';
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name talk.altbetexchange.com;

  ssl_certificate /etc/biptrix/tls/origin.crt;
  ssl_certificate_key /etc/biptrix/tls/origin.key;

  access_log /var/log/nginx/talk_access.log;
  error_log /var/log/nginx/talk_error.log;

  # The load balancers reach 10.50.1.126 from their 10.50.1.0/24 interfaces.
  allow 10.50.1.70;  # lb1
  allow 10.50.1.71;  # lb2
  allow 10.50.1.72;  # floating address on the lb pair
  allow 127.0.0.1;
  deny all;

  # Uploads stream to the app, which enforces per-file and per-org limits.
  client_max_body_size 2g;
  proxy_request_buffering off;

  location / {
    proxy_pass http://biptrix;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $biptrix_connection;
    proxy_set_header Host $host;
    # HAProxy already replaced these with the verified client IP; pass them
    # through unchanged so the app (TRUST_PROXY=1) reads the real client.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-Proto https;
    # Long-lived WebSockets (the app pings every 25 s).
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
